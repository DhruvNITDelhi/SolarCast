services:
  - type: web
    name: solarcast-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SOLARCAST_CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: OPEN_METEO_USER_AGENT
        value: SolarCast/1.0
      - key: FORECAST_CACHE_TTL_SECONDS
        value: 300
      - key: FORECAST_CACHE_MAX_ENTRIES
        value: 256
